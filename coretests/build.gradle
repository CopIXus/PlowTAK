plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.9.24'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        // Follow the JDK running Gradle (17 on CI, 21 on dev machines that
        // only have a current Microsoft JDK installed).
        def spec = Integer.parseInt(System.getProperty("java.specification.version"))
        languageVersion = JavaLanguageVersion.of(spec)
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    testImplementation 'junit:junit:4.13.2'
}

// Compile only the framework-free packages out of the app module.
// Anything that imports android.* / com.atakmap (SDK) stays out of this list.
sourceSets {
    main {
        kotlin {
            srcDirs = ['../app/src/main/java']
            include 'com/atakmap/android/plowtak/model/**'
            include 'com/atakmap/android/plowtak/coverage/**'
            include 'com/atakmap/android/plowtak/gis/**'
            include 'com/atakmap/android/plowtak/ops/**'
            include 'com/atakmap/android/plowtak/equipment/**'
            include 'com/atakmap/android/plowtak/cot/codec/**'
            include 'com/atakmap/android/plowtak/cot/SelfCotFilter.kt'
            include 'com/atakmap/android/plowtak/cot/PliRemarks.kt'
            include 'com/atakmap/android/plowtak/cot/CotLinkState.kt'
            // report/ mixes pure exporters with ATAK-touching reporters —
            // include only the framework-free files.
            include 'com/atakmap/android/plowtak/report/StormExportData.kt'
            include 'com/atakmap/android/plowtak/report/ExportFormat.kt'
            include 'com/atakmap/android/plowtak/report/GeoJsonExporter.kt'
            include 'com/atakmap/android/plowtak/report/CsvExporter.kt'
            include 'com/atakmap/android/plowtak/report/MetricsCalculator.kt'
            // sync/ pure codecs; MissionCoverageSync / TakServerTargets need ATAK HTTP.
            include 'com/atakmap/android/plowtak/sync/MissionCoverageCodec.kt'
            include 'com/atakmap/android/plowtak/sync/ConditionMissionCodec.kt'
            include 'com/atakmap/android/plowtak/sync/UnitStatusMissionCodec.kt'
            include 'com/atakmap/android/plowtak/sync/OpsMissionCodec.kt'
            include 'com/atakmap/android/plowtak/sync/HazardMissionCodec.kt'
            include 'com/atakmap/android/plowtak/sync/StormConfigCodec.kt'
        }
    }
    test {
        kotlin {
            srcDirs = ['../app/src/test/java']
            // TakServerTargets needs ATAK CotMapComponent — not in coretests.
            exclude 'com/atakmap/android/plowtak/sync/TakServerTargetsUrlTest.kt'
        }
    }
}

test {
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
