name: Release

# Do not build on main push. Sign via TAK.gov TPC, then publish the signed APK
# with workflow_dispatch (publish_release=true) or a v* tag when ready.
# One APK per ATAK-CIV line (5.6.0, 5.7.0, 5.8.0). A missing SDK cache release
# fails only that line.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create/update a GitHub Release (only after tak.gov TPC APK is ready)"
        required: false
        type: boolean
        default: false
      plugin_version:
        description: "Override PLUGIN_VERSION (yy.mmdd.HHmm UTC). Empty = build time UTC."
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      name: ${{ steps.ver.outputs.name }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          REF="${{ github.ref }}"
          SHA="${GITHUB_SHA:0:7}"
          OVERRIDE="${{ github.event.inputs.plugin_version }}"
          if [[ -n "$OVERRIDE" ]]; then
            VERSION="$OVERRIDE"
          elif [[ "$REF" =~ ^refs/tags/v(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            # yy.mmdd.HHmm in UTC (24z), e.g. 26.0809.0935
            VERSION="$(date -u +'%y.%m%d.%H%M')"
          fi
          TAG="build-$VERSION"
          if [[ "$REF" =~ ^refs/tags/v ]]; then
            TAG="${{ github.ref_name }}"
          fi
          NAME="PlowTAK $VERSION"
          if [[ "$REF" == "refs/heads/main" ]]; then
            NAME="PlowTAK $VERSION (main @$SHA)"
          fi
          PUBLISH="false"
          if [[ "$REF" =~ ^refs/tags/v ]]; then
            PUBLISH="true"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.publish_release }}" == "true" ]]; then
            PUBLISH="true"
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "name=$NAME"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$TAG version=$VERSION publish=$PUBLISH"

  build:
    name: ATAK ${{ matrix.atak }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - atak: "5.6.0"
            cache_tag: atak-civ-5.6.0
          - atak: "5.7.0"
            cache_tag: atak-civ-5.7.0
          - atak: "5.8.0"
            cache_tag: atak-civ-5.8.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Download ATAK-CIV SDK jars from private cache
        env:
          GH_TOKEN: ${{ secrets.CI_SDK_REPO_TOKEN }}
          CACHE_REPO: ${{ secrets.ATAK_SDK_CACHE_REPO }}
          CACHE_TAG: ${{ matrix.cache_tag }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$CACHE_REPO" ]; then
            echo "::error::Missing CI_SDK_REPO_TOKEN / ATAK_SDK_CACHE_REPO."
            echo "See docs/ci-build.md — SDK jars are too large for GitHub Actions secrets."
            exit 1
          fi
          mkdir -p atak-sdk
          if ! gh release download "$CACHE_TAG" \
            -R "$CACHE_REPO" \
            -p "*-ci-jars.zip" \
            -D "$RUNNER_TEMP/sdk"; then
            echo "::error::No SDK cache release $CACHE_TAG on $CACHE_REPO. See docs/ci-build.md."
            exit 1
          fi
          unzip -o "$RUNNER_TEMP/sdk/"*-ci-jars.zip -d atak-sdk
          ls -la atak-sdk/
          test -f atak-sdk/main.jar
          test -f atak-sdk/atak-gradle-takdev.jar

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 — cannot produce a signed APK."
            exit 1
          fi
          mkdir -p ci
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ci/release.jks
          ls -la ci/release.jks

      - name: Write local.properties for CI
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          sdk.path=${GITHUB_WORKSPACE}/atak-sdk
          takdev.plugin=${GITHUB_WORKSPACE}/atak-sdk/atak-gradle-takdev.jar
          takReleaseKeyFile=${GITHUB_WORKSPACE}/ci/release.jks
          takReleaseKeyFilePassword=${STORE_PASS}
          takReleaseKeyAlias=${KEY_ALIAS}
          takReleaseKeyPassword=${KEY_PASS}
          takDebugKeyFile=${GITHUB_WORKSPACE}/ci/release.jks
          takDebugKeyFilePassword=${STORE_PASS}
          takDebugKeyAlias=${KEY_ALIAS}
          takDebugKeyPassword=${KEY_PASS}
          EOF
          sed -i 's/^[[:space:]]*//' local.properties
          cat local.properties | sed 's/Password=.*/Password=***/;s/password=.*/password=***/'

      - name: Assemble signed CIV release
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/ci/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleCivRelease \
            -PPLUGIN_VERSION=${{ needs.version.outputs.version }} \
            -Patak.version=${{ matrix.atak }} \
            -Psdk.path="${GITHUB_WORKSPACE}/atak-sdk" \
            -Ptakdev.plugin="${GITHUB_WORKSPACE}/atak-sdk/atak-gradle-takdev.jar" \
            --stacktrace

      - name: Package APK + SHA256
        id: pkg
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/civ/release/*${{ matrix.atak }}*.apk | head -n1)
          if [ -z "$SRC" ]; then
            echo "No APK under app/build/outputs/apk/civ/release/" >&2
            find app/build/outputs -name '*.apk' || true
            exit 1
          fi
          case "$SRC" in
            *unsigned*) echo "Refusing to publish unsigned APK: $SRC"; exit 1 ;;
          esac
          cp "$SRC" "dist/$(basename "$SRC")"
          (cd dist && sha256sum "$(basename "$SRC")" | awk '{print $1 "  " $2}' > "$(basename "$SRC").sha256")
          echo "apk=$(basename "$SRC")" >> "$GITHUB_OUTPUT"
          ls -la dist/
          cat dist/*.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: plowtak-${{ matrix.atak }}
          path: dist/*

  publish:
    name: Publish GitHub Release
    needs: [version, build]
    if: always() && needs.version.result == 'success' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          pattern: plowtak-*
          path: dist
          merge-multiple: true

      - name: List APKs
        id: apks
        run: |
          shopt -s nullglob
          files=(dist/*.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "No APKs were built."
            exit 0
          fi
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          ls -la dist/

      - name: Create GitHub Release
        if: needs.version.outputs.publish == 'true' && steps.apks.outputs.count != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.name }}
          generate_release_notes: true
          files: |
            dist/*
          body: |
            **PlowTAK** build `${{ needs.version.outputs.version }}`.

            Install the APK whose name contains the ATAK-CIV version on the device
            (`ATAK-5.6.0`, `ATAK-5.7.0`, or `ATAK-5.8.0`), then enable the plugin
            in ATAK → Settings → Tool Preferences / Plugins.

            Field devices on release ATAK need the **TPC-signed** APK from
            [tak.gov](https://tak.gov) user_builds — CopIX CI signatures will show
            “signature INVALID” on Load. Upload one source zip per ATAK line.

            Peer dependency: **VNS 4.0** from [tak.gov](https://tak.gov) for offline maps.
            Verify each APK with the matching `.sha256` sidecar.

            Licensed under the [PlowTAK Free Application License 1.0](LICENSE).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip GitHub Release (waiting on tak.gov)
        if: needs.version.outputs.publish != 'true'
        run: |
          echo "Built ${{ steps.apks.outputs.count }} APK(s) but did not publish a GitHub Release."
          echo "Re-run with workflow_dispatch publish_release=true after the TPC APK is available from tak.gov."

      - name: Fail when every line failed
        if: steps.apks.outputs.count == '0'
        run: |
          echo "::error::No ATAK line produced an APK. Check the SDK cache releases in docs/ci-build.md."
          exit 1
