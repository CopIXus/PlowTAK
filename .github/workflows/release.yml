name: Release

# Hold GitHub Releases until a TPC-signed APK is downloaded from tak.gov.
# Main pushes still build a CopIX-signed APK artifact for smoke tests.
# Publish only via workflow_dispatch with publish_release=true (or a v* tag
# after the tak.gov artifact is ready to attach).
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create/update a GitHub Release (only after tak.gov TPC APK is ready)"
        required: false
        type: boolean
        default: false
      plugin_version:
        description: "Override PLUGIN_VERSION (yy.mmdd.HHmm UTC). Empty = build time UTC."
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build CIV APK and optionally publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          REF="${{ github.ref }}"
          SHA="${GITHUB_SHA:0:7}"
          OVERRIDE="${{ github.event.inputs.plugin_version }}"
          if [[ -n "$OVERRIDE" ]]; then
            VERSION="$OVERRIDE"
          elif [[ "$REF" =~ ^refs/tags/v(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            # yy.mmdd.HHmm in UTC (24z), e.g. 26.0809.0935
            VERSION="$(date -u +'%y.%m%d.%H%M')"
          fi
          TAG="build-$VERSION"
          if [[ "$REF" =~ ^refs/tags/v ]]; then
            TAG="${{ github.ref_name }}"
          fi
          NAME="PlowTAK $VERSION"
          if [[ "$REF" == "refs/heads/main" ]]; then
            NAME="PlowTAK $VERSION (main @$SHA)"
          fi
          PUBLISH="false"
          if [[ "$REF" =~ ^refs/tags/v ]]; then
            PUBLISH="true"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.publish_release }}" == "true" ]]; then
            PUBLISH="true"
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "name=$NAME"
            echo "sha=$SHA"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$TAG version=$VERSION publish=$PUBLISH"

      - name: Download ATAK-CIV SDK jars from private cache
        env:
          GH_TOKEN: ${{ secrets.CI_SDK_REPO_TOKEN }}
          CACHE_REPO: ${{ secrets.ATAK_SDK_CACHE_REPO }}
          CACHE_TAG: ${{ secrets.ATAK_SDK_RELEASE_TAG }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$CACHE_REPO" ] || [ -z "$CACHE_TAG" ]; then
            echo "::error::Missing CI_SDK_REPO_TOKEN / ATAK_SDK_CACHE_REPO / ATAK_SDK_RELEASE_TAG."
            echo "See docs/ci-build.md — SDK jars are too large for GitHub Actions secrets."
            exit 1
          fi
          mkdir -p atak-sdk
          gh release download "$CACHE_TAG" \
            -R "$CACHE_REPO" \
            -p "*-ci-jars.zip" \
            -D "$RUNNER_TEMP/sdk"
          unzip -o "$RUNNER_TEMP/sdk/"*-ci-jars.zip -d atak-sdk
          ls -la atak-sdk/
          test -f atak-sdk/main.jar
          test -f atak-sdk/atak-gradle-takdev.jar

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 — cannot produce a signed APK."
            exit 1
          fi
          mkdir -p ci
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ci/release.jks
          ls -la ci/release.jks

      - name: Write local.properties for CI
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          sdk.path=${GITHUB_WORKSPACE}/atak-sdk
          takdev.plugin=${GITHUB_WORKSPACE}/atak-sdk/atak-gradle-takdev.jar
          takReleaseKeyFile=${GITHUB_WORKSPACE}/ci/release.jks
          takReleaseKeyFilePassword=${STORE_PASS}
          takReleaseKeyAlias=${KEY_ALIAS}
          takReleaseKeyPassword=${KEY_PASS}
          takDebugKeyFile=${GITHUB_WORKSPACE}/ci/release.jks
          takDebugKeyFilePassword=${STORE_PASS}
          takDebugKeyAlias=${KEY_ALIAS}
          takDebugKeyPassword=${KEY_PASS}
          EOF
          sed -i 's/^[[:space:]]*//' local.properties
          cat local.properties | sed 's/Password=.*/Password=***/;s/password=.*/password=***/'

      - name: Assemble signed CIV release
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/ci/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleCivRelease \
            -PPLUGIN_VERSION=${{ steps.ver.outputs.version }} \
            --stacktrace

      - name: Package APK + SHA256
        id: pkg
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/civ/release/*.apk | head -n1)
          if [ -z "$SRC" ]; then
            echo "No APK under app/build/outputs/apk/civ/release/" >&2
            find app/build/outputs -name '*.apk' || true
            exit 1
          fi
          case "$SRC" in
            *unsigned*) echo "Refusing to publish unsigned APK: $SRC"; exit 1 ;;
          esac
          OUT="dist/PlowTAK-${{ steps.ver.outputs.version }}-ATAK-5.8.0-civ-release.apk"
          cp "$SRC" "$OUT"
          (cd dist && sha256sum "$(basename "$OUT")" | awk '{print $1 "  " $2}' > "$(basename "$OUT").sha256")
          echo "apk=$(basename "$OUT")" >> "$GITHUB_OUTPUT"
          ls -la dist/
          cat dist/*.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlowTAK-civ-release
          path: dist/*

      - name: Create GitHub Release
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }}
          generate_release_notes: true
          files: |
            dist/*
          body: |
            **PlowTAK** build `${{ steps.ver.outputs.version }}` (ATAK-CIV 5.8 plugin).

            Install `${{ steps.pkg.outputs.apk }}` on a device running **ATAK-CIV 5.8.x**,
            then enable the plugin in ATAK → Settings → Tool Preferences / Plugins.

            Field devices on release ATAK need the **TPC-signed** APK from
            [tak.gov](https://tak.gov) user_builds — CopIX CI signatures will show
            “signature INVALID” on Load.

            Peer dependency: **VNS 4.0** from [tak.gov](https://tak.gov) for offline maps.
            Verify the APK with the matching `.sha256` sidecar.

            Licensed under the [PlowTAK Free Application License 1.0](LICENSE).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip GitHub Release (waiting on tak.gov)
        if: steps.ver.outputs.publish != 'true'
        run: |
          echo "Built ${{ steps.pkg.outputs.apk }} but did not publish a GitHub Release."
          echo "Re-run with workflow_dispatch publish_release=true after the TPC APK is available from tak.gov."
