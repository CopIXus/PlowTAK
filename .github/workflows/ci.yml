name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coretests:
    name: Engine unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x ./gradlew ./coretests/gradlew

      - name: Run framework-free engine tests
        run: ./gradlew -p coretests test --stacktrace
