name: CI

# Engine tests only on demand or PRs — do not build on main push.
# Field APKs come from tak.gov TPC signing, published as tpc-* GitHub Releases.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  coretests:
    name: Engine unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run framework-free engine tests
        run: ./gradlew -p coretests test --stacktrace
