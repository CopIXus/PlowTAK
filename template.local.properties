# Template for tak.gov Third Party Pipeline / local SDK builds.
# Copy to local.properties locally — NEVER commit real credentials.
#
# On user_builds, tak.gov injects takrepo credentials and the release keystore.
# Keep placeholders only in this template that ships inside the submission zip.

sdk.dir=<directory path to the Android SDK>
takrepo.url=https://artifacts.tak.gov/artifactory/maven
takrepo.user=<username>
takrepo.password=<password>
takdev.plugin=.
