////////////////////////////////////////////////////////////////////////////////
// PlowTAK ATAK plugin module.
// Follows the ATAK-CIV plugin template conventions (takdev plugin, main.jar as
// compileOnly via takdev, civ flavor, ATAK APK naming).
////////////////////////////////////////////////////////////////////////////////

buildscript {

    // Build-time stamp yy.mmdd.HHmm in UTC (24z). CI can override with -PPLUGIN_VERSION=...
    ext.PLUGIN_VERSION = project.findProperty('PLUGIN_VERSION') ?: new Date().format("yy.MMdd.HHmm", TimeZone.getTimeZone("UTC"))
    // Default line. Local and CI builds for 5.6.0 / 5.7.0 pass -Patak.version
    // together with -Psdk.path and -Ptakdev.plugin (scripts/build-atak.ps1).
    // tak.gov TPP runs assembleCivRelease with no -P, so each submission zip
    // pins the literal below to the ATAK line that zip is for.
    ext.ATAK_VERSION = "5.8.0"
    if (project.hasProperty('atak.version'))
        ext.ATAK_VERSION = project.property('atak.version').toString()

    def takdevVersion = '3.+'

    def getValueFromPropertiesFile = { propFile, key ->
        if (!propFile.isFile() || !propFile.canRead())
            return null
        def prop = new Properties()
        def reader = propFile.newReader()
        try {
            prop.load(reader)
        } finally {
            reader.close()
        }
        return prop.get(key)
    }

    def getProperty = { name, defValue ->
        def prop = project.properties[name] ?:
                getValueFromPropertiesFile(project.rootProject.file('local.properties'), name)
        return (null == prop) ? defValue : prop
    }

    def urlKey = 'takrepo.url'

    ext.isDevKitEnabled = { ->
        return getProperty(urlKey, null) != null
    }

    ext.takrepoUrl = getProperty(urlKey, 'http://localhost/')
    ext.takrepoUser = getProperty('takrepo.user', 'invalid')
    ext.takrepoPassword = getProperty('takrepo.password', 'invalid')
    // Offline fallback: path to atak-gradle-takdev.jar from the ATAK-CIV SDK.
    ext.takdevPlugin = getProperty('takdev.plugin', "${rootDir}/../atak-gradle-takdev.jar")

    repositories {
        google()
        mavenCentral()
        maven {
            url = takrepoUrl
            credentials {
                username = takrepoUser
                password = takrepoPassword
            }
            allowInsecureProtocol = true
        }
    }

    dependencies {
        // Match ATAK-CIV 5.8.0.1 samples (main.jar ships Kotlin 2.2 metadata).
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.0'
        if (isDevKitEnabled()) {
            classpath "com.atakmap.gradle:atak-gradle-takdev:${takdevVersion}"
        } else {
            classpath files(takdevPlugin)
        }
    }
}

// Required so dependencies (kotlin-stdlib, etc.) resolve from Maven — takdev
// offline mode otherwise only searches .takdev/aars/. Matches ATAK 5.8 samples.
allprojects {
    repositories {
        google()
        mavenCentral()
        mavenLocal()
    }
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'atak-takdev-plugin'

def getGitShortSha() {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
            standardOutput = stdout
            errorOutput = new ByteArrayOutputStream()
        }
        def desc = stdout.toString().trim()
        return desc.isEmpty() ? "" : desc
    } catch (Exception ignored) {
        return ""
    }
}

// Android versionCode from yy.mmdd.HHmm (UTC), fits in signed 32-bit int through ~2041.
// The ATAK minor is added so 5.6 / 5.7 / 5.8 of the same minute do not share a
// code (an MDM treats the same package and code with different hashes as a bad
// update). 5.6 -> +0, 5.7 -> +1, 5.8 -> +2. A later timestamp still sorts above
// an earlier one on every line.
def atakMinorOffset(String atak) {
    def parts = atak.tokenize('.')
    int minor = (parts.size() > 1 && parts[1].isInteger()) ? (parts[1] as int) : 8
    return Math.max(0, minor - 6)
}

def getVersionCodeFromPluginVersion(String ver) {
    def m = (ver =~ /^(\d{2})\.(\d{4})\.(\d{4})$/)
    if (m.matches()) {
        int yy = m[0][1] as int
        int mmdd = m[0][2] as int
        int hhmm = m[0][3] as int
        return ((yy - 20) * 100000000) + (mmdd * 10000) + hhmm + atakMinorOffset(ATAK_VERSION as String)
    }
    return 1
}

def getValueFromPropertiesFile = { propFile, key ->
    if (!propFile.isFile() || !propFile.canRead())
        return null
    def prop = new Properties()
    def reader = propFile.newReader()
    try {
        prop.load(reader)
    } finally {
        reader.close()
    }
    return prop.get(key)
}

def getProperty = { name, defValue ->
    def prop = project.properties[name] ?:
            getValueFromPropertiesFile(project.rootProject.file('local.properties'), name)
    return (null == prop) ? defValue : prop
}

android {
    namespace 'com.atakmap.android.plowtak'
    compileSdk 34

    defaultConfig {
        applicationId "com.atakmap.android.plowtak.plugin"
        minSdk 26
        targetSdk 34
        versionCode getVersionCodeFromPluginVersion(PLUGIN_VERSION as String)
        versionName PLUGIN_VERSION + " (" + getGitShortSha() + ") - [" + ATAK_VERSION + "]"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Required by the TAK plugin template: without this the TAK inner signing
    // check fails and the plugin will not load.
    bundle {
        storeArchive {
            enable = false
        }
    }

    signingConfigs {
        debug {
            // Precedence: local.properties -> ANDROID_* env (GitHub Actions) ->
            // takdev-provided keystore (tak.gov Third Party Pipeline). The takdev
            // plugin downloads the keystore artifact to ${buildDir}/android_keystore
            // with the template's fixed credentials.
            def kf = getProperty('takDebugKeyFile', System.getenv('ANDROID_KEYSTORE_FILE'))
            if (kf != null) {
                storeFile file(kf)
                storePassword getProperty('takDebugKeyFilePassword',
                        System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: '')
                keyAlias getProperty('takDebugKeyAlias',
                        System.getenv('ANDROID_KEY_ALIAS') ?: '')
                keyPassword getProperty('takDebugKeyPassword',
                        System.getenv('ANDROID_KEY_PASSWORD') ?: '')
            } else {
                storeFile file("${buildDir}/android_keystore")
                storePassword "tnttnt"
                keyAlias "wintec_mapping"
                keyPassword "tnttnt"
            }
        }
        release {
            def kf = getProperty('takReleaseKeyFile', System.getenv('ANDROID_KEYSTORE_FILE'))
            if (kf != null) {
                storeFile file(kf)
                storePassword getProperty('takReleaseKeyFilePassword',
                        System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: '')
                keyAlias getProperty('takReleaseKeyAlias',
                        System.getenv('ANDROID_KEY_ALIAS') ?: '')
                keyPassword getProperty('takReleaseKeyPassword',
                        System.getenv('ANDROID_KEY_PASSWORD') ?: '')
            } else {
                storeFile file("${buildDir}/android_keystore")
                storePassword "tnttnt"
                keyAlias "wintec_mapping"
                keyPassword "tnttnt"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            matchingFallbacks = ['sdk']
        }
        release {
            minifyEnabled true
            proguardFile 'proguard-gradle.txt'
            signingConfig signingConfigs.release
            matchingFallbacks = ['odk']
        }
    }

    flavorDimensions = ["application"]

    productFlavors {
        civ {
            getIsDefault().set(true)
            dimension "application"
            manifestPlaceholders = [atakApiVersion: "com.atakmap.app@" + ATAK_VERSION + ".CIV"]
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST']
        }
    }

    sourceSets {
        main {
            // PlowTAK-26.0809.0935-ATAK-5.8.0
            setProperty("archivesBaseName",
                    rootProject.name + "-" + PLUGIN_VERSION + "-ATAK-" + ATAK_VERSION)
            defaultConfig.versionCode = getVersionCodeFromPluginVersion(PLUGIN_VERSION as String)
        }
    }

    // Descriptive APK names, e.g.
    // PlowTAK-26.0809.0935-ATAK-5.8.0-civ-release.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName =
                    rootProject.name + "-" + PLUGIN_VERSION + "-ATAK-" + ATAK_VERSION + "-" +
                    variant.flavorName + "-" + variant.buildType.name + ".apk"
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.0'
    // When takrepo.url is set (tak.gov Third Party Pipeline / artifacts.tak.gov),
    // atak-takdev-plugin already resolves the ATAK API from Maven. An extra
    // compileOnly on a local main.jar breaks TPP because that path does not exist
    // (/app/plugin-src/.../atak-sdk/main.jar). Use the local jar only for offline
    // builds (GitHub Actions / local SDK extract).
    if (!isDevKitEnabled()) {
        def sdkPath = getProperty('sdk.path', "${rootProject.projectDir}/atak-sdk")
        compileOnly files("${sdkPath}/main.jar")
    }
}
